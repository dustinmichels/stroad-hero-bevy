[tools]
# Bevy's MSRV is "the latest stable Rust", so track latest stable rather than pinning.
rust = "latest"
oxfmt = "latest"

[tasks.fmt]
description = "Format Rust and repository files (oxfmt) across the workspace"
run = ["cargo fmt --all", "oxfmt"]

[tasks.dev]
description = "Run with Bevy dynamically linked (fast iterative rebuilds)"
run = "cargo run --features dynamic_linking"

[tasks.build]
description = "Build with Bevy dynamically linked (shares artifacts with `dev`)"
run = "cargo build --features dynamic_linking"
